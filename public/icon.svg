<!-- Favicon del rediseño (2026-09-06) — logo real de Ocean Flow.
     Es un SVG que envuelve un PNG en base64, no un vectorial de verdad:
     el logo solo se entregó como foto/JPEG (dos JPG en la raíz del repo,
     sin fuente vectorial disponible — ver docs/DESIGN-SYSTEM.md §1.1).
     Sustituir por un <path> real en cuanto exista un SVG/AI oficial del
     logo. Mientras tanto, envolver el PNG en <svg> evita tocar el
     <link rel="icon" type="image/svg+xml"> de index.html. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <image href="data:image/png;base64," width="64" height="64" />
</svg>
