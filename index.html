<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover es necesario para que env(safe-area-inset-*)
         funcione en iPhone (notch / barra inferior). interactive-widget=
         resizes-content (Safari 16.4+/Chrome 108+, WICG Interactive Widget)
         corrige un bug real reportado: en una pantalla con muy poco
         contenido (p. ej. Mi trabajo sin movimientos), Safari mantiene su
         barra de herramientas inferior expandida al no haber nada que
         desplazar, y la barra de navegación `fixed` de la app queda anclada
         al viewport de layout (que asume la barra de Safari colapsada) en
         vez de al viewport visual real — el menú "desaparece" tapado tras
         la barra de Safari. Con resizes-content el navegador redimensiona
         el viewport CSS cuando su propia barra cambia de tamaño, así que
         los elementos `fixed` siempre se recalculan contra el área
         realmente visible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>Ocean Flow — Control de ingresos para instructores de buceo</title>
    <meta name="description" content="Ocean Flow: registra tus clases de buceo, comisiones y pagos por escuela, con resumen mensual y anual." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- noindex a propósito: es una herramienta personal/privada con datos
         de facturación, no contenido pensado para aparecer en buscadores.
         Si en algún momento tiene login multiusuario y quieres promocionarla
         como producto, cambia esto a "index, follow" y añade contenido
         público real (una landing, no la app en sí).
         Reforzado por /robots.txt (public/robots.txt, Disallow: /) desde
         2026-09-07 — antes vivía en la raíz del repo, no en public/, así
         que Vite nunca lo incluía en el build real y devolvía 404 en
         producción (mismo bug de fondo que manifest.json, corregido
         antes en esta misma sesión: publicDir es solo public/). -->

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#063256" />

    <!-- Open Graph / redes sociales — investigado 2026-09-07 (fuentes:
         https://www.krumzi.com/blog/open-graph-image-sizes-for-social-media-the-complete-2026-guide,
         https://env.dev/guides/opengraph-image-sizes): la URL de
         og:image/twitter:image debe ser ABSOLUTA — una ruta relativa
         como "/og-image.png" no se resuelve en la mayoría de rastreadores
         de vista previa (WhatsApp, iMessage, Slack...), que no conocen el
         dominio de origen de la página. Bug real corregido aquí (antes
         era una ruta relativa); og-image.png ya medía 1200×630 (1.91:1),
         el tamaño recomendado universal, sin necesidad de regenerarlo.
         og:url añadido (buena práctica estándar, antes ausente). Dominio
         fijo al de producción real (ver "Ramas y entornos" en CLAUDE.md)
         — la vista previa social no depende de qué entorno sirve la
         página, solo necesita una imagen accesible. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ocean Flow" />
    <meta property="og:title" content="Ocean Flow — Control de ingresos para instructores de buceo" />
    <meta property="og:description" content="Registra clases, comisiones y pagos por escuela, con resumen mensual y anual." />
    <meta property="og:image" content="https://dive-tracker-exgg.vercel.app/og-image.png" />
    <meta property="og:url" content="https://dive-tracker-exgg.vercel.app/" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ocean Flow" />
    <meta name="twitter:description" content="Control de ingresos para instructores de buceo." />
    <meta name="twitter:image" content="https://dive-tracker-exgg.vercel.app/og-image.png" />

    <!-- Datos estructurados: ayuda tanto a buscadores clásicos como a
         motores de respuesta con IA (Google SGE, Perplexity, etc.) a
         entender qué es la app sin tener que interpretar el HTML -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Ocean Flow",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Control de ingresos para instructores de buceo: registro de clases, comisiones, pagos por escuela y resumen mensual/anual."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
